services:
  _defaults:
    autowire: true
    autoconfigure: true
  kiwi.contao.designer.frontend:
    public: true
    class: Kiwi\Contao\DesignerBundle\Service\DesignerFrontendService
  Kiwi\Contao\DesignerBundle\EventListener\LoadFormFieldListener:
    arguments:
      - '@kiwi.contao.designer.frontend'
  Kiwi\Contao\DesignerBundle\EventListener\GeneratePageListener: ~
  Kiwi\Contao\DesignerBundle\EventListener\AlterBootstrapImports: ~
  Kiwi\Contao\DesignerBundle\EventListener\LoadDataContainerListener: ~
  Kiwi\Contao\DesignerBundle\EventListener\GetContentElementListener: ~
  Kiwi\Contao\DesignerBundle\Twig\DesignerExtension:
    arguments:
      - '@kiwi.contao.designer.frontend'
    tags:
      - 'twig.extension'
  Kiwi\Contao\DesignerBundle\Migration\SyncColorVars: ~
  Kiwi\Contao\DesignerBundle\DataContainer\ColorSchemeListener: ~
  Kiwi\Contao\DesignerBundle\DataContainer\CtaListener: ~
  Kiwi\Contao\DesignerBundle\DataContainer\SectionHeadlineListener: ~
  Kiwi\Contao\DesignerBundle\Command\GenerateSchemesCommand: ~
  Kiwi\Contao\DesignerBundle\Service\SchemesFileRegenerator:
    arguments:
      - '@filesystem'
      - '@twig'
      - '%kernel.project_dir%'
      - '@Kiwi\Contao\DesignerBundle\Service\ThemeStylesInvalidator'
  Kiwi\Contao\DesignerBundle\CacheWarmer\SchemesCacheWarmer: ~
  # Positional arguments: named ones would make Symfony reflect the bootstrap class, which may be missing.
  Kiwi\Contao\DesignerBundle\Service\ThemeStylesInvalidator:
    public: true
    arguments:
      - '@contao.framework'
      - '@?Kiwi\Contao\BootstrapBundle\Service\ThemeStylesInvalidator'
      - '@?logger'
